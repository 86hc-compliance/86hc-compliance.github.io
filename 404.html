<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面未找到 (404) - 86HC 恒诚合规开放门户</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --font-sans: "Inter", "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --surface: #ffffff;
      --surface-sub: #f8fafc;
      --border-subtle: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --blue: #1d6ff2;
      --blue-hover: #1558cc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--surface-sub);
      color: var(--text-primary);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 640px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }
    .code {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: #1558cc;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 { font-size: 24px; font-weight: 500; margin-bottom: 10px; }
    p { font-size: 14.5px; color: var(--text-secondary); margin-bottom: 24px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--blue); color: #ffffff; font-weight: 600; font-size: 14px;
      padding: 9px 18px; border-radius: 8px; text-decoration: none;
    }
    .btn-primary:hover { background: var(--blue-hover); }
    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center;
      background: #f5f8fb; color: #0d192b; font-weight: 600; font-size: 13px;
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border-subtle);
      text-decoration: none;
    }
    .btn-secondary:hover { border-color: var(--blue); color: var(--blue); }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">HTTP 404 · 页面未找到</div>
    <h1>您访问的页面不存在或已迁移</h1>
    <p>您可以返回 86HC 恒诚香港合规开放门户首页，或直接访问以下常用合规工具与查册频道。</p>
    <div class="actions">
      <a href="https://86hc-compliance.github.io/" class="btn-primary">返回开放门户首页</a>
      <a href="https://86hc-compliance.github.io/nar1-late-fee-calculator.html" class="btn-secondary">NAR1 罚款计算器</a>
      <a href="https://86hc-compliance.github.io/hk-bank-clearing-swift-codes.html" class="btn-secondary">银行清算编号</a>
      <a href="https://86hc-compliance.github.io/tc/" class="btn-secondary">繁體中文 (/tc/)</a>
      <a href="https://86hc-compliance.github.io/en/" class="btn-secondary">English (/en/)</a>
      <a href="https://www.86hc.com/company-search" class="btn-secondary">86hc.com 查册中心</a>
    </div>
  </div>
</body>
</html>
